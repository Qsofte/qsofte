name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck, unit tests, build
        run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile)
        run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t qsofte-web:ci .
      - name: Smoke test image (HTTP mode, no cert) - pages, 404s, redirects, headers
        run: |
          docker run -d --name web -e DOMAIN=localhost -e DESK_DOMAIN=desk.localhost -p 8080:80 qsofte-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          docker exec web nginx -t
          code() { curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"; }
          # Each page is prerendered with its own canonical and content
          curl -fsS http://localhost:8080/srovi | grep -q '<link rel="canonical" href="https://qsofte.com/srovi" />'
          curl -fsS http://localhost:8080/samewe | grep -q '<h1'
          # Real 404s and permanent redirects for retired URLs
          test "$(code /no-such-page)" = 404
          test "$(code /services)" = 301
          test "$(code /Connect)" = 301
          test "$(code /products/)" = 301
          # Security headers, on the 404 page too
          curl -sI http://localhost:8080/no-such-page | grep -qi '^content-security-policy:'
          curl -sI http://localhost:8080/ | grep -qi '^permissions-policy:'
          # The Desk's HTTP-only vhost serves nothing until it has a certificate.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: desk.localhost' http://localhost:8080/)" = 503 ]
      - name: Check the Desk's HTTPS vhost parses
        run: |
          docker exec web sh -c 'apk add -q openssl >/dev/null && mkdir -p /etc/letsencrypt/live/desk.localhost \
            && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=desk.localhost \
               -keyout /etc/letsencrypt/live/desk.localhost/privkey.pem -out /etc/letsencrypt/live/desk.localhost/fullchain.pem 2>/dev/null \
            && DESK_DOMAIN=desk.localhost envsubst "\$DESK_DOMAIN" < /etc/nginx/qsofte/desk-https.conf.template > /etc/nginx/conf.d/desk.conf \
            && nginx -t'

  desk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U desk" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desk/backend/requirements*.txt
      - name: Backend tests
        working-directory: desk/backend
        run: |
          pip install -r requirements-test.txt
          python -m pytest -q
      - name: Migrations run on Postgres and match the models
        working-directory: desk/backend
        env:
          DESK_DATABASE_URL: postgresql+asyncpg://desk:desk@localhost:5432/desk
        run: |
          alembic upgrade head
          alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desk/frontend/package-lock.json
      - name: Frontend typecheck, tests, build
        working-directory: desk/frontend
        run: |
          npm ci
          npm run check
      - name: Build and smoke test the desk image
        run: |
          docker build -t qsofte-desk:ci desk
          docker run -d --name desk --network host \
            -e DESK_DATABASE_URL=postgresql+asyncpg://desk:desk@localhost:5432/desk \
            -e DESK_SECRET_KEY=ci-only-secret-key-ci-only-secret-key \
            -e DESK_ADMIN_EMAIL=ci@example.com -e DESK_ADMIN_PASSWORD=ci-only-password-123 \
            qsofte-desk:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/today)" = 401 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Desk-Request: 1' -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-only-password-123"}' http://localhost:8000/api/auth/login)
          [ "$code" = 200 ] || { docker logs desk; exit 1; }
