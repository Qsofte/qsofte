# Local Postgres for Desk development: docker compose -f desk/docker-compose.dev.yml up -d
services:
  desk-db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5433:5432"
    volumes:
      - desk_dev_db:/var/lib/postgresql/data
volumes:
  desk_dev_db:
